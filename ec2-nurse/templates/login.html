<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMak Clinic — Nurse Portal Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div class="card" style="width: 100%; max-width: 380px; padding: 32px 28px;">
    
    <header class="header-brand" style="text-align: center; align-items: center;">
      <span class="brand-eyebrow">University of Makati</span>
      <h1 class="brand-title" style="font-size: 22px;">Clinic Staff Portal</h1>
      <p class="brand-subtitle">Enter your clinic PIN to manage today's queue and private visit notes.</p>
    </header>

    {% if error %}
    <div class="alert alert-error" style="text-align: center;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label class="form-label" for="pin">Clinic Access PIN</label>
        <input
          type="password"
          id="pin"
          name="pin"
          class="input mono-num"
          style="text-align: center; font-size: 18px; letter-spacing: 0.15em;"
          placeholder="••••••••"
          required
          autofocus
        >
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="padding: 12px;">
        Sign In to Station
      </button>
    </form>

    <div class="privacy-banner" style="font-size: 11px;">
      <svg class="privacy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span><strong>Staff Authentication:</strong> Health records and visit notes are strictly restricted to authorized medical personnel.</span>
    </div>

  </div>

</body>
</html>
